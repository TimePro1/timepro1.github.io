<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimePro1 Tracker ⏲️</title>
    <style>
    body {
     font-family: sans-serif;
       }
    </style>
</head>
<body>
    <h1>TimePro1 Clock</h1>

<p>00:00</p>
<script>
const select = document.querySelector("select");
const output = document.createElement("p");
document.body.appendChild(output);

function update() {
  output.textContent = "Selected timezone: " + select.value;
}

setInterval(update, 1000);
update();
</script>
<select>
  <option value="UTC">UTC</option>
  <option value="HST">HST</option>
  <option value="MART">Marquesas</option>
  <option value="MST">MST</option>
  <option value="CSR">CST</option>
  <option value="EST">EST</option>
  <option value="AST">AST</option>
  <option value="BRT">BRT</option>
  <option value="SST">SST</option>
  <option value="CVT">CVT</option>
  <option value="SGT">SGT</option>
</select>

    <script>
function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent = now.toLocaleTimeString();
  }

  setInterval(updateClock, 1000);
  updateClock(); // run immediately
    </script>

<p>TimePro1 is a clock designed to run perfectly within all time zones!</p>
</body>
</html>
